name: CloudDB Sentinel CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  PYTHONPATH: .

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias de desarrollo
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pyyaml

      - name: Validar sintaxis y errores críticos con Flake8
        run: |
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ tests/ --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Validar archivos de configuración YAML
        run: |
          python -c "
          import yaml
          from pathlib import Path
          for f in Path('config').glob('*.y*ml'):
              with open(f, 'r', encoding='utf-8') as yf:
                  yaml.safe_load(yf)
              print(f'✓ Archivo YAML válido: {f}')
          "

  test:
    name: Unit Tests (${{ matrix.os }} - Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Copiar configuración de entorno para pruebas
        run: |
          python -c "import shutil, os; shutil.copy('.env.example', '.env') if not os.path.exists('.env') else None"

      - name: Ejecutar Suite de Pruebas Automatizadas con Pytest
        run: |
          python -m pytest tests/ -v --color=yes
