name: CloudDB Sentinel CI/CD (Enterprise Hardened)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  lint-and-security:
    name: Code Quality, Linting & IaC Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias de linting y seguridad
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pyyaml

      - name: Validar sintaxis y estándares con Flake8
        run: |
          # Errores críticos de sintaxis (E9, F63, F7, F82)
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Complejidad ciclomática y longitud de línea
          flake8 src/ tests/ --count --max-complexity=20 --max-line-length=130 --statistics

      - name: Validar archivos de configuración YAML
        run: |
          python -c "
          import yaml
          from pathlib import Path
          for f in Path('config').glob('*.y*ml'):
              with open(f, 'r', encoding='utf-8') as yf:
                  yaml.safe_load(yf)
              print(f'✓ Archivo YAML válido: {f}')
          "

      - name: Configurar Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Validar Formato de Terraform (terraform fmt)
        run: |
          terraform -chdir=terraform fmt -check

      - name: Inicializar y Validar Sintaxis Terraform
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

  unit-tests:
    name: Test Suite (${{ matrix.os }} - Python ${{ matrix.python-version }})
    needs: lint-and-security
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Copiar configuración de entorno para pruebas
        run: |
          python -c "import shutil, os; shutil.copy('.env.example', '.env') if not os.path.exists('.env') else None"

      - name: Ejecutar Suite de Pruebas Automatizadas con Cobertura
        run: |
          python -m pytest tests/ -v --cov=src --cov-report=term-missing --color=yes
